name: Deploy Twine Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tweego
        run: |
          wget -q "https://github.com/tmedwards/tweego/releases/download/v2.1.1/tweego-2.1.1-linux-x64.zip" -O tweego.zip
          unzip -q tweego.zip -d tweego-bin
          chmod +x tweego-bin/tweego

      - name: Install SugarCube 2 story format
        run: |
          wget -q "https://github.com/tmedwards/sugarcube-2/releases/download/v2.37.3/sugarcube-2.37.3-for-twine-2.1-local.zip" -O sugarcube.zip
          mkdir -p storyformats
          unzip -q sugarcube.zip -d storyformats

      - name: Verify setup
        run: |
          echo "Tweego version:"
          ./tweego-bin/tweego --version
          echo "Story formats:"
          ls -la storyformats/sugarcube-2/

      - name: Build story
        run: |
          mkdir -p dist
          TWEEGO_PATH="$(pwd)/storyformats" ./tweego-bin/tweego -o dist/index.html src/story.twee

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
